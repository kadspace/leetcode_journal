<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Mode</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }
        #editor-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        #chat-container {
            width: 50%;
            display: flex;
            flex-direction: column;
            background-color: #252526;
        }
        textarea#code-editor {
            flex-grow: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            border: none;
            padding: 20px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        #chat-history {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 8px;
            line-height: 1.4;
        }
        .user-msg {
            background-color: #0e639c; /* VS Code Blue-ish */
            align-self: flex-end;
            color: white;
        }
        .bot-msg {
            background-color: #333;
            align-self: flex-start;
            border: 1px solid #454545;
        }
        #input-area {
            padding: 20px;
            background-color: #1e1e1e;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }
        input#chat-input {
            flex-grow: 1;
            padding: 10px;
            background-color: #333;
            border: 1px solid #454545;
            color: white;
            border-radius: 4px;
            outline: none;
        }
        input#chat-input:focus {
            border-color: #0e639c;
        }
        button {
            padding: 10px 20px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #1177bb;
        }
        button:disabled {
            background-color: #555;
            cursor: not-allowed;
        }
        #status {
            font-size: 12px;
            color: #888;
            padding: 5px 20px;
            text-align: right;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

<div id="editor-container">
    <textarea id="code-editor" placeholder="# Type your python code here..."></textarea>
    <div id="status">Ready</div>
</div>

<div id="chat-container">
    <div id="chat-history">
        <div class="message bot-msg">Mode: Practice.<br>I am ready to help you invalid your assumptions. What are we working on?</div>
    </div>
    <div id="input-area">
        <input type="text" id="chat-input" placeholder="Ask a question..." autocomplete="off">
        <button id="send-btn">Send</button>
    </div>
</div>

<script>
    const editor = document.getElementById('code-editor');
    const statusDiv = document.getElementById('status');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const chatHistory = document.getElementById('chat-history');

    // Load from localStorage if available
    const savedCode = localStorage.getItem('practice_code');
    if (savedCode) {
        editor.value = savedCode;
    }

    let saveTimeout;
    editor.addEventListener('input', () => {
        statusDiv.innerText = "Typing...";
        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(saveCode, 1000);
    });

    async function saveCode() {
        statusDiv.innerText = "Saving...";
        const code = editor.value;
        localStorage.setItem('practice_code', code);
        
        try {
            await fetch('/api/save', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ code })
            });
            statusDiv.innerText = "Saved to session.";
        } catch (e) {
            statusDiv.innerText = "Error saving to disk.";
            console.error(e);
        }
    }

    async function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;

        // User Message
        appendMessage(text, 'user-msg');
        chatInput.value = '';
        sendBtn.disabled = true;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: text,
                    code: editor.value 
                })
            });
            const data = await response.json();
            
            if (data.detail) {
                appendMessage("Error: " + data.detail, 'bot-msg');
            } else {
                appendMessage(data.response, 'bot-msg');
            }
        } catch (e) {
            appendMessage("Error connecting to server.", 'bot-msg');
        } finally {
            sendBtn.disabled = false;
        }
    }

    function appendMessage(text, className) {
        const div = document.createElement('div');
        div.className = `message ${className}`;
        div.innerHTML = text.replace(/\n/g, '<br>');
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Handle Tab key in textarea
    editor.addEventListener('keydown', function(e) {
        if (e.key == 'Tab') {
            e.preventDefault();
            var start = this.selectionStart;
            var end = this.selectionEnd;

            // set textarea value to: text before caret + tab + text after caret
            this.value = this.value.substring(0, start) +
            "    " + this.value.substring(end);

            // put caret at right position again
            this.selectionStart = this.selectionEnd = start + 4;
            
            // Trigger save after a tab too
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(saveCode, 1000);
        }
    });

</script>

</body>
</html>
